<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hanns EV Garage — Katalog</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <script src="data.js"></script>

    <header>
      <div class="header-text">
        <h1>Hanns EV Garage</h1>
        <p>Jual Beli Sepeda &amp; Motor Listrik</p>
      </div>

      <!-- Menu Navigasi dipindah ke dalam header -->
      <div class="nav-tabs">
        <button id="btn-motor" class="active" onclick="switchTab('motor')">Motor Listrik</button>
        <button id="btn-sparepart" onclick="switchTab('sparepart')">Sparepart</button>
        <button id="btn-konsultasi" onclick="switchTab('konsultasi')">Konsultasi</button>
      </div>
    </header>

    <div class="main-content">
      <div class="grid" id="katalog-container"></div>

      <!-- Tampilan Konsultasi Baru (Lebih Simpel) -->
      <div class="form-container" id="konsultasi-container">
        <div class="form-card" style="text-align: center; max-width: 500px; margin: 40px auto; padding: 40px 30px;">
          <!-- Ikon Kunci Pas (SVG) -->
          <div style="background: var(--accent-dim); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
            </svg>
          </div>
          
          <h2 style="font-family: 'DM Sans', sans-serif; color: var(--text-main); font-size: 1.8em; margin-bottom: 15px; font-weight: 700;">Butuh Bantuan Teknis?</h2>
          
          <p style="color: var(--text-muted); font-size: 1em; line-height: 1.6; margin-bottom: 30px;">
            Konsultasikan kendala motor listrik, upgrade baterai, BMS, atau custom controller langsung dengan teknisi kami.
          </p>

          <button onclick="kirimWhatsAppKonsultasi()" class="btn-whatsapp" style="border: none; cursor: pointer; justify-content: center; background: #2563eb; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);">
            Chat WhatsApp Sekarang
          </button>
        </div>
      </div>
    </div>

<footer>
      <div class="social-links">
        <a href="https://www.tiktok.com/@hannsgarage" target="_blank" class="social-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
          </svg>
          @hannsgarage
        </a>
      </div>
      

<!-- INI TAMBAHAN COUNTER VISITOR NYA -->
      <div style="margin-bottom: 15px;">
        <img src="https://hits.sh/andri282.github.io/h4nn5ev.svg?label=Visitors&color=0ea5e9&labelColor=0d1520" alt="Visitor Count" />
      </div>

      <p>&copy; 2026 <span class="footer-brand">Hanns EV Garage</span>. All Rights Reserved.</p>
    </footer>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
      <div class="modal-content" onclick="event.stopPropagation()">
        <button class="close-btn" onclick="closeModal(event)">✕</button>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <script>
      function formatRupiah(angka) {
        let n = angka.toString().replace(/[^0-9]/g, "");
        return new Intl.NumberFormat("id-ID", {
          style: "currency",
          currency: "IDR",
          minimumFractionDigits: 0,
        }).format(n);
      }

      function switchTab(tab) {
        ["motor", "sparepart", "konsultasi"].forEach((t) => {
          document.getElementById("btn-" + t).classList.toggle("active", t === tab);
        });

        const katalog = document.getElementById("katalog-container");
        const form = document.getElementById("konsultasi-container");

        if (tab === "konsultasi") {
          katalog.style.display = "none";
          form.style.display = "block";
        } else {
          katalog.style.display = "grid";
          form.style.display = "none";
          renderKatalog(tab);
        }
      }

      function kirimWhatsAppKonsultasi() {
        const teks = `Halo Hanns EV Garage,\n\nSaya butuh konsultasi bantuan teknis / jasa dari website.`;
        window.open(`https://wa.me/6282136538487?text=${encodeURIComponent(teks)}`, "_blank");
      }

      function renderKatalog(filterTipe) {
        const container = document.getElementById("katalog-container");
        container.innerHTML = "";

        const data = database.filter((item) => item.tipe === filterTipe);

        if (data.length === 0) {
          container.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
          </svg>
          <p>Belum ada item di kategori ini.</p>
        </div>`;
          return;
        }

        data.forEach((item) => {
          const img = item.images && item.images.length > 0 ? item.images[0] : "https://via.placeholder.com/800x600/0d1520/1e3a5f?text=No+Image";

          container.innerHTML += `
        <div class="card" onclick="openModal(${item.id})">
          <div class="card-img-wrapper">
            <img src="${img}" alt="${item.nama}" loading="lazy">
          </div>
          <div class="card-content">
            <h3>${item.nama}</h3>
            <p class="harga">${formatRupiah(item.harga)}</p>
          </div>
        </div>`;
        });
      }

      function openModal(id) {
        const item = database.find((x) => x.id === id);
        if (!item) return;

        const mainImg = item.images && item.images.length > 0 ? item.images[0] : "https://via.placeholder.com/800x600/0d1520/1e3a5f?text=No+Image";

        let thumbsHtml = "";
        if (item.images && item.images.length > 0) {
          item.images.forEach((img, i) => {
            thumbsHtml += `<img src="${img}" class="${i === 0 ? "active" : ""}" onclick="changeMainImage(this, '${img}')" alt="thumb ${i + 1}">`;
          });
        }

        document.getElementById("modalBody").innerHTML = `
      <div class="modal-gallery">
        <div class="main-img-container">
          <img id="mainImageDisplay" src="${mainImg}" alt="${item.nama}">
        </div>
        ${item.images && item.images.length > 1 ? `<div class="thumbnails">${thumbsHtml}</div>` : ""}
      </div>
      <div class="modal-info">
        <h2>${item.nama}</h2>
        <div class="harga-detail">${formatRupiah(item.harga)}</div>
        <h4>Deskripsi Produk</h4>
        <p>${item.deskripsi}</p>
        <a href="https://wa.me/6282136538487?text=Halo%20Hanns%20EV%20Garage,%20saya%20mau%20tanya%20tentang%20${encodeURIComponent(item.nama)}" target="_blank" class="btn-whatsapp">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
          Tanya via WhatsApp
        </a>
      </div>`;

        const modal = document.getElementById("modalOverlay");
        modal.style.display = "flex";
        setTimeout(() => modal.classList.add("active"), 10);
        document.body.style.overflow = "hidden";
      }

      function changeMainImage(el, src) {
        document.getElementById("mainImageDisplay").src = src;
        document.querySelectorAll(".thumbnails img").forEach((t) => t.classList.remove("active"));
        el.classList.add("active");
      }

      function closeModal(event) {
        if (event && event.target.closest(".modal-content") && !event.target.classList.contains("close-btn")) return;
        const modal = document.getElementById("modalOverlay");
        modal.classList.remove("active");
        setTimeout(() => {
          modal.style.display = "none";
        }, 300);
        document.body.style.overflow = "auto";
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      switchTab("motor");
    </script>
  </body>
</html>
